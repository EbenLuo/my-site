<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Learning HTML — app icon</title>
  <style>
    html,
    body {
      width: 512px;
      height: 512px;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: #d9482b;
      color: #fffaf1;
      font-family: Georgia, "Times New Roman", serif;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 512px;
      height: 512px;
      font-size: 258px;
      font-weight: 700;
      letter-spacing: -16px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="icon">LH</div>
</body>
</html>
