<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Learning HTML — Open Graph poster</title>
  <style>
    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f5efe3;
      color: #1c2733;
      font-family: Georgia, "Times New Roman", serif;
    }

    .poster {
      position: relative;
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      padding: 56px 70px;
      background-image: radial-gradient(rgba(28, 39, 51, 0.12) 1.4px, transparent 1.4px);
      background-size: 28px 28px;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 3px solid #1c2733;
      pointer-events: none;
    }

    .top {
      font: 700 18px "Cascadia Code", Consolas, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mark {
      display: inline-block;
      margin-right: 8px;
      padding: 3px 9px;
      background: #d9482b;
      color: #fffaf1;
    }

    h1 {
      margin: 32px 0 0;
      font-size: 154px;
      line-height: 0.85;
      letter-spacing: -7px;
    }

    h1 span {
      color: #d9482b;
    }

    .tag {
      margin: 20px 0 0;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 33px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .foot {
      position: absolute;
      left: 70px;
      bottom: 58px;
      font: 600 19px "Cascadia Code", Consolas, monospace;
      color: #5c6773;
    }

    .stamp {
      position: absolute;
      right: 70px;
      bottom: 56px;
      display: grid;
      width: 146px;
      height: 146px;
      place-items: center;
      border: 4px solid #1c2733;
      box-shadow: 9px 9px 0 #1c2733;
      color: #d9482b;
      font: 800 52px "Cascadia Code", Consolas, monospace;
      transform: rotate(-4deg);
    }
  </style>
</head>
<body>
  <div class="poster">
    <p class="top"><span class="mark">&lt;/&gt;</span> Web Technologies 2026 · BiUH</p>
    <h1>Learning<br><span>HTML</span></h1>
    <p class="tag">Structure. Style. Interaction.</p>
    <p class="foot">A small site built by hand · Eben Luo</p>
    <div class="stamp" aria-hidden="true">&lt;/&gt;</div>
  </div>
</body>
</html>
